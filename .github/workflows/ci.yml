name: FuegoClaro CI

on:
  push:
    branches: [main, develop, Juan]
  pull_request:
    branches: [main, develop, Juan]

jobs:
  backend-tests:
    name: Backend Pytest (FastAPI & ML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'Hackaton/backend/requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Hackaton/backend/requirements.txt -r Hackaton/backend/requirements-dev.txt

      - name: Run Pytest Test Suite
        working-directory: Hackaton
        run: |
          pytest tests/backend/ -v

  frontend-build:
    name: Frontend Build (TypeScript & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Hackaton/frontend/package-lock.json'

      - name: Install dependencies
        working-directory: Hackaton/frontend
        run: npm ci

      - name: Typecheck and Build
        working-directory: Hackaton/frontend
        run: npm run build
